name: Atualizar dados

on:
  schedule:
    - cron: '17 9 * * *'   # todo dia, 06h17 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar do hathdata.com e montar README e página
        run: python3 scripts/atualizar.py
      - name: Versionar se mudou
        run: |
          git config user.name "hathdata-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados README.md docs
          git diff --cached --quiet || git commit -m "Dados: atualização de $(date -u +%d/%m/%Y)"
          git push
